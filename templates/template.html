<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏文本浏览器（中外对照）</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }

        header { background: white; padding: 0.75rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        header h2 { margin: 0; font-size: 1.15rem; white-space: nowrap; }
        .search-container { flex: 1; max-width: 600px; }
        #searchInput { width: 100%; padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 1rem; }
        #stats { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; }

        main { flex: 1; display: flex; overflow: hidden; }

        aside { width: 264px; background: white; border-right: 1px solid var(--border); padding: 1.25rem; overflow-y: auto; }
        .filter-section { margin-bottom: 1.75rem; }
        .filter-section h3 { font-size: 0.8125rem; color: var(--muted); text-transform: uppercase; margin: 0 0 0.75rem; }
        .cat-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; cursor: pointer; font-size: 0.9rem; }
        .cat-row { display: flex; align-items: center; gap: 0.35rem; }
        .cat-toggle { cursor: pointer; color: var(--muted); font-size: 0.7rem; width: 0.9rem; user-select: none; flex: none; }
        .cat-row .cat-item { flex: 1; font-weight: 600; }
        .sub-list { margin: 0.05rem 0 0.45rem 1.05rem; padding-left: 0.5rem; border-left: 2px solid var(--border); }
        .sub-item { font-weight: 400; font-size: 0.84rem; }
        .cnt { margin-left: auto; font-size: 0.7rem; color: var(--muted); background: #f1f5f9; border-radius: 0.6rem; padding: 0 0.42rem; }
        select, input[type="range"] { width: 100%; padding: 0.35rem; border: 1px solid var(--border); border-radius: 0.375rem; background: white; font-size: 0.85rem; }
        label.field { display: block; font-size: 0.8125rem; color: var(--muted); margin: 0.6rem 0 0.25rem; }

        #results { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
        .entry { background: white; border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.25rem; margin-bottom: 0.85rem; transition: 0.2s; }
        .entry:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 10px -2px rgba(0,0,0,0.08); }
        .entry-meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.5rem; display: flex; gap: 0.75rem; align-items: center; }
        .tag { background: #dbeafe; color: #1e40af; padding: 0.1rem 0.5rem; border-radius: 0.25rem; }
        .lang-badge { background: #f1f5f9; color: var(--muted); padding: 0.1rem 0.45rem; border-radius: 0.25rem; font-size: 0.68rem; }
        .entry-text { font-size: 1.08rem; line-height: 1.65; cursor: pointer; border-radius: 0.375rem; padding: 0.25rem 0.4rem; margin: 0 -0.4rem; }
        .entry-text:hover { background: #eff6ff; }
        .entry-text.native { font-size: 0.98rem; color: #475569; margin-top: 0.35rem; }
        .entry-text.missing { color: #cbd5e1; font-style: italic; cursor: default; }
        .entry-text.missing:hover { background: none; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 1.5rem; padding: 1rem; background: white; border-top: 1px solid var(--border); }
        button { padding: 0.45rem 1rem; border: 1px solid var(--border); background: white; border-radius: 0.375rem; cursor: pointer; font-size: 0.9rem; }
        button:hover { background: #f8fafc; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h2>游戏文本浏览器</h2>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索语料（Key、外语或中文）...">
    </div>
    <div id="stats"></div>
</header>

<main>
    <aside>
        <div class="filter-section">
            <h3>语言与对照</h3>
            <label class="field">外语</label>
            <select id="langSelect"></select>
            <label class="field">显示模式</label>
            <select id="modeSelect">
                <option value="pair">中外对照</option>
                <option value="foreign">仅外语</option>
                <option value="native">仅中文</option>
            </select>
        </div>

        <div class="filter-section">
            <h3>语料分类</h3>
            <div style="font-size:.72rem;color:var(--muted);margin:-.4rem 0 .5rem">默认不勾选，勾哪个显示哪个</div>
            <div id="categoryList"></div>
        </div>

        <div class="filter-section">
            <h3>语音设置（点击文本朗读）</h3>
            <label class="field">外语音色</label>
            <select id="fVoiceSelect"></select>
            <label class="field">中文音色</label>
            <select id="zVoiceSelect"></select>
            <label class="field">语速: <span id="rateVal">1.0</span>x</label>
            <input type="range" id="voiceRate" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
    </aside>

    <div id="results"></div>
</main>

<div class="pagination">
    <button id="prevBtn">上一页</button>
    <span id="pageInfo">第 1 页 / 共 1 页</span>
    <button id="nextBtn">下一页</button>
</div>

<script src="data.js"></script>
<script>
/* ================= 数据兼容层 =================
 * 新版数据: META + DATA[i].t = { english:'...', japanese:'...' }, DATA[i].z = 中文
 *           c=一级分类（中文）, c2=二级分类（中文，可选；缺失时侧栏自动降级为扁平列表）
 * 旧版数据: 无 META，DATA[i].t 为字符串，无 z —— 自动降级为单语模式
 */
/* data.js 已在全局声明 const META / const DATA，用 IIFE 参数注入，避免重复 const 声明 */
(function (META) {
if (META === undefined) META = null;
const LANG_NAMES = {
    english: 'English 英语', japanese: '日本語 日语', german: 'Deutsch 德语',
    french: 'Français 法语', spanish: 'Español 西班牙语', russian: 'Русский 俄语',
    korean: '한국어 韩语', polish: 'Polski 波兰语', italian: 'Italiano 意大利语',
    turkish: 'Türkçe 土耳其语', braz_por: 'Português 葡语(巴西)', portuguese: 'Português 葡语',
    dutch: 'Nederlands 荷兰语', simp_chinese: '简体中文', traditional_chinese: '繁體中文'
};
const FALLBACK_CODES = { english: 'en', japanese: 'ja', german: 'de', french: 'fr', spanish: 'es', russian: 'ru', korean: 'ko', simp_chinese: 'zh-CN', traditional_chinese: 'zh-TW' };

let allVoices = [];
let filtered = [];
// 一级分类勾选：空集合=一个都不显示（默认全部不勾，勾哪个显示哪个）；selectedSub: 一级 -> 二级集合（空 Set=该一级下全选，非空=只看这些二级）
let selectedCats = new Set();
let selectedSub = new Map();
let expandedCats = new Set();
let catTree = null;
let hasC2 = false;
let currentPage = 1;
const pageSize = 50;
let settings = { lang: '', mode: 'pair', rate: 1.0, fVoice: {}, zVoice: '' };

const STORAGE_KEY = 'game_text_browser_settings';

function langCode(l) {
    if (META && META.codes && META.codes[l]) return META.codes[l];
    return FALLBACK_CODES[l] || '';
}
function langLabel(l) { return LANG_NAMES[l] || l; }

// 数据中实际可用的外语列表
function detectLangs() {
    if (META && META.langs && META.langs.length) return META.langs.slice();
    const s = new Set();
    (typeof DATA !== 'undefined' ? DATA : []).forEach(d => {
        if (d.t && typeof d.t === 'object') Object.keys(d.t).forEach(k => s.add(k));
    });
    return [...s];
}

// 取条目外语文本（兼容旧版字符串格式）
function foreignText(d) {
    if (d.t == null) return '';
    if (typeof d.t === 'string') return d.t;
    return d.t[settings.lang] || '';
}
function nativeText(d) { return d.z || ''; }
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ================= 初始化 ================= */
function init() {
    if (typeof DATA === 'undefined') {
        document.getElementById('results').innerHTML = '<div style="color:red;padding:2rem">错误：未找到 data.js 数据文件，请确认它与本 HTML 在同一目录。</div>';
        return;
    }

    loadSettings();

    const langs = detectLangs();
    const langSel = document.getElementById('langSelect');
    if (langs.length === 0) {
        // 旧版单语数据
        langSel.innerHTML = '<option value="">默认（单语数据）</option>';
        langSel.disabled = true;
        settings.lang = '';
    } else {
        if (!langs.includes(settings.lang)) settings.lang = langs[0];
        langSel.innerHTML = langs.map(l => `<option value="${esc(l)}">${esc(langLabel(l))}</option>`).join('');
        langSel.value = settings.lang;
    }

    const hasNative = DATA.some(d => nativeText(d));
    if (!hasNative) {
        // 没有中文数据时锁定仅外语
        document.getElementById('modeSelect').querySelector('option[value="pair"]').disabled = true;
        document.getElementById('modeSelect').querySelector('option[value="native"]').disabled = true;
        settings.mode = 'foreign';
    }
    document.getElementById('modeSelect').value = settings.mode;
    document.getElementById('voiceRate').value = settings.rate;
    document.getElementById('rateVal').textContent = Number(settings.rate).toFixed(1);

    buildCatTree();
    renderCategoryTree();

    bindEvents();
    loadVoices();
    update();
}

function loadSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) settings = Object.assign(settings, saved);
    } catch (e) { /* 忽略损坏的本地配置 */ }
}
function saveSettings() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
}

/* ================= 二级分类树（数据无 c2 时自动降级为扁平列表） ================= */
function buildCatTree() {
    catTree = {};
    hasC2 = false;
    DATA.forEach(d => {
        const c = d.c || '其他';
        const c2 = d.c2 || '其他';
        if (d.c2) hasC2 = true;
        if (!catTree[c]) catTree[c] = { total: 0, subs: {} };
        catTree[c].total++;
        catTree[c].subs[c2] = (catTree[c].subs[c2] || 0) + 1;
    });
    if (expandedCats.size === 0) Object.keys(catTree).forEach(c => expandedCats.add(c));
}

function renderCategoryTree() {
    const list = document.getElementById('categoryList');
    // 旧数据（无 c2）：保持扁平复选框
    if (!hasC2) {
        list.innerHTML = Object.entries(catTree).sort((a, b) => b[1].total - a[1].total).map(([c, info]) =>
            `<label class="cat-item"><input type="checkbox" data-cat="${esc(c)}" ${selectedCats.has(c) ? 'checked' : ''}> ${esc(c)}<span class="cnt">${info.total}</span></label>`
        ).join('');
        return;
    }
    list.innerHTML = Object.entries(catTree).sort((a, b) => b[1].total - a[1].total).map(([c, info]) => {
        const isOpen = expandedCats.has(c);
        const checked = selectedCats.has(c);
        const set = selectedSub.get(c);
        const partial = checked && set && set.size > 0;
        let html = `<div class="cat-row">
            <span class="cat-toggle" data-toggle="${esc(c)}" title="展开/折叠">${isOpen ? '▼' : '▶'}</span>
            <label class="cat-item"><input type="checkbox" data-cat="${esc(c)}" ${checked ? 'checked' : ''}> ${esc(c)}<span class="cnt">${info.total}</span></label>
        </div>`;
        if (isOpen) {
            const subs = Object.entries(info.subs).sort((a, b) => b[1] - a[1]);
            html += '<div class="sub-list">' + subs.map(([s, n]) => {
                // 一级未选：所有二级一律不勾；一级全选（set 为空）：全勾；部分选中（set 非空）：只勾集合内的
                const subChecked = checked && (!set || set.size === 0 || set.has(s));
                return `<label class="cat-item sub-item"><input type="checkbox" data-cat="${esc(c)}" data-sub="${esc(s)}" ${subChecked ? 'checked' : ''}> ${esc(s)}<span class="cnt">${n}</span></label>`;
            }).join('') + '</div>';
        }
        return html;
    }).join('');
    // 部分选中时一级框显示横杠
    list.querySelectorAll('input[data-cat]').forEach(cb => {
        if (!cb.dataset.sub) {
            const set = selectedSub.get(cb.dataset.cat);
            cb.indeterminate = selectedCats.has(cb.dataset.cat) && set && set.size > 0;
        }
    });
}

function toggleTopCat(c, on) {
    if (on) { selectedCats.add(c); if (hasC2 && !selectedSub.has(c)) selectedSub.set(c, new Set()); }
    else { selectedCats.delete(c); selectedSub.delete(c); }
}

function toggleSubCat(c, s, on) {
    const allSubs = Object.keys(catTree[c].subs);
    let set = selectedSub.get(c);
    if (on) {
        // 一级未选时直接点二级：等价于只勾这一个二级
        if (!selectedCats.has(c)) {
            selectedCats.add(c);
            selectedSub.set(c, new Set([s]));
            return;
        }
        if (!set || set.size === 0) return; // 已是全选，无需处理
        set.add(s);
        // 二级勾满时归一为全选（空 Set）
        if (set.size >= allSubs.length) selectedSub.set(c, new Set());
    } else {
        if (!selectedCats.has(c)) return;
        // 全选模式下取消一个：先展开为“全有”集合再移除
        if (!set || set.size === 0) set = new Set(allSubs);
        set.delete(s);
        if (set.size === 0) { selectedCats.delete(c); selectedSub.delete(c); }
        else selectedSub.set(c, set);
    }
}

function catMatch(d) {
    if (!selectedCats.size) return false; // 默认全部不勾 -> 一条都不显示
    const c = d.c || '其他';
    if (!selectedCats.has(c)) return false;
    const set = selectedSub.get(c);
    if (set && set.size) return set.has(d.c2 || '其他');
    return true;
}

/* ================= 过滤与渲染 ================= */
function update() {
    const term = document.getElementById('searchInput').value.trim().toLowerCase();
    filtered = DATA.filter(d => {
        if (!catMatch(d)) return false;
        if (!term) return true;
        const ft = foreignText(d).toLowerCase();
        const zt = nativeText(d).toLowerCase();
        return d.k.toLowerCase().includes(term)
            || (d.f || '').toLowerCase().includes(term)
            || ft.includes(term) || zt.includes(term);
    });
    document.getElementById('stats').textContent = `共 ${filtered.length} 条`;
    currentPage = 1;
    render();
}

function render() {
    const start = (currentPage - 1) * pageSize;
    const slice = filtered.slice(start, start + pageSize);
    const mode = settings.mode;
    const showF = mode !== 'native';
    const showZ = mode !== 'foreign';
    const fCode = langCode(settings.lang);

    let html = slice.map((d, i) => {
        const ft = foreignText(d);
        const zt = nativeText(d);
        let body = '';
        if (showF) {
            body += ft
                ? `<div class="entry-text speak" data-idx="${start + i}" data-side="f" title="点击朗读">${esc(ft).replace(/\n/g, '<br>')}</div>`
                : (showZ ? '<div class="entry-text missing">（无外语译文）</div>' : '');
        }
        if (showZ) {
            body += zt
                ? `<div class="entry-text native speak" data-idx="${start + i}" data-side="z" title="点击朗读">${esc(zt).replace(/\n/g, '<br>')}</div>`
                : (showF ? '<div class="entry-text native missing">（无中文译文）</div>' : '');
        }
        const badge = settings.lang ? `<span class="lang-badge">${esc(langLabel(settings.lang))}</span>` : '';
        return `
            <div class="entry">
                <div class="entry-meta">
                    <span class="tag">${esc(d.c || '其他')}${d.c2 ? ' / ' + esc(d.c2) : ''}</span>
                    ${badge}
                    <span>${esc(d.f || '')} | ${esc(d.k)}</span>
                </div>
                ${body}
            </div>`;
    }).join('');
    if (!filtered.length) html = '<div style="text-align:center;color:#64748b;padding:5rem 1rem;line-height:2.2">请在左侧「语料分类」勾选要浏览的分类<br>默认不勾选任何分类，勾哪个显示哪个</div>';
    document.getElementById('results').innerHTML = html;

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    document.getElementById('pageInfo').textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage === totalPages;
    document.getElementById('results').scrollTop = 0;
}

/* ================= 语音（按语言选音色，本地离线优先） ================= */
function loadVoices() {
    allVoices = speechSynthesis.getVoices();
    fillVoiceSelect('zVoiceSelect', META ? META.nativeCode : 'zh-CN', settings.zVoice, '中文');
    refreshForeignVoices();
}

function refreshForeignVoices() {
    const code = langCode(settings.lang);
    const preferred = settings.fVoice[settings.lang] || '';
    fillVoiceSelect('fVoiceSelect', code, preferred, langLabel(settings.lang) || '外语');
}

function fillVoiceSelect(selId, langCodePref, preferredName, label) {
    const sel = document.getElementById(selId);
    if (!sel) return;
    const matched = allVoices.filter(v => !langCodePref || v.lang.toLowerCase().startsWith(langCodePref.toLowerCase()));
    const localFirst = matched.sort((a, b) => (b.localService ? 1 : 0) - (a.localService ? 1 : 0));
    const others = allVoices.filter(v => !matched.includes(v));
    const group = (list, title) => list.length
        ? `<optgroup label="${title}">${list.map(v => `<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})${v.localService ? ' · 离线' : ''}</option>`).join('')}</optgroup>`
        : '';
    sel.innerHTML = '<option value="">系统默认</option>' + group(localFirst, label + '音色') + group(others, '其他音色');
    if (preferredName && [...sel.options].some(o => o.value === preferredName)) sel.value = preferredName;
}

function speak(text, side) {
    if (!text) return;
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    const code = side === 'z' ? (META ? META.nativeCode : 'zh-CN') : langCode(settings.lang);
    const voiceName = side === 'z' ? settings.zVoice : settings.fVoice[settings.lang];

    const voice = allVoices.find(v => v.name === voiceName)
        || allVoices.find(v => (!code || v.lang.toLowerCase().startsWith(code.toLowerCase())) && v.localService)
        || allVoices.find(v => !code || v.lang.toLowerCase().startsWith(code.toLowerCase()));
    if (voice) utt.voice = voice;
    if (code) utt.lang = code;
    utt.rate = parseFloat(settings.rate) || 1.0;
    speechSynthesis.speak(utt);
}

/* ================= 事件 ================= */
let searchTimer = null;
function bindEvents() {
    document.getElementById('searchInput').oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(update, 200);
    };
    const catList = document.getElementById('categoryList');
    catList.addEventListener('click', (e) => {
        const tgl = e.target.closest && e.target.closest('[data-toggle]');
        if (!tgl) return;
        const c = tgl.dataset.toggle;
        if (expandedCats.has(c)) expandedCats.delete(c); else expandedCats.add(c);
        renderCategoryTree();
    });
    catList.addEventListener('change', (e) => {
        const cb = e.target;
        if (cb.tagName !== 'INPUT' || !cb.dataset.cat) return;
        const c = cb.dataset.cat;
        if (cb.dataset.sub) toggleSubCat(c, cb.dataset.sub, cb.checked);
        else toggleTopCat(c, cb.checked);
        renderCategoryTree();
        update();
    });
    document.getElementById('langSelect').onchange = (e) => {
        settings.lang = e.target.value;
        saveSettings();
        refreshForeignVoices();
        update();
    };
    document.getElementById('modeSelect').onchange = (e) => {
        settings.mode = e.target.value;
        saveSettings();
        render();
    };
    document.getElementById('voiceRate').oninput = (e) => {
        settings.rate = parseFloat(e.target.value);
        document.getElementById('rateVal').textContent = settings.rate.toFixed(1);
        saveSettings();
    };
    document.getElementById('fVoiceSelect').onchange = (e) => {
        settings.fVoice[settings.lang] = e.target.value;
        saveSettings();
    };
    document.getElementById('zVoiceSelect').onchange = (e) => {
        settings.zVoice = e.target.value;
        saveSettings();
    };
    document.getElementById('prevBtn').onclick = () => { currentPage--; render(); };
    document.getElementById('nextBtn').onclick = () => { currentPage++; render(); };

    // 事件委托：点击外语/中文文本分别朗读
    document.getElementById('results').addEventListener('click', (e) => {
        const el = e.target.closest('.speak');
        if (!el) return;
        const d = filtered[parseInt(el.dataset.idx, 10)];
        if (!d) return;
        speak(el.dataset.side === 'z' ? nativeText(d) : foreignText(d), el.dataset.side);
    });

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
}

window.onload = init;
})(typeof META !== 'undefined' ? META : null);
</script>
</body>
</html>
